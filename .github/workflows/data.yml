name: Data

on:
  schedule:
    # Off the full hour: GitHub often delays jobs at :00, and the 90 min limit of the stale data banner
    # leaves only 30 min of slack.
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
  # A change to this file is tried for real in its PR; only runs on main publish anything.
  pull_request:
    paths:
      - .github/workflows/data.yml

permissions:
  contents: read

concurrency:
  # One fixed group: a PR run and the hourly run must not call MET at the same time (10 calls/s).
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    # Covers the worst case of about 35 min, and this job stays under the hour between scheduled runs. The
    # concurrency group also holds verify: the read-back normally adds a few minutes.
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      run_id: ${{ steps.target.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Exit 1 when under 95 % are valid or the run crashed. The quality report is only in the log then.
      # The limit also bounds slow 5xx answers: stopping here turns the run red, while reaching
      # timeout-minutes is reported as cancelled.
      - name: Run the data program
        shell: bash
        run: |
          set -o pipefail
          timeout 45m npm run data 2>&1 | tee data-run.log

      # AD-10: a run without latest.json publishes nothing, so the branch keeps the last valid file. The
      # check also runs on PRs, so a problem with the run ID shows up before it reaches main.
      - name: Check the file and choose whether to publish
        id: target
        run: |
          if [ ! -f public/data/latest.json ]; then
            echo "::error::Dataprogrammet laget ikke public/data/latest.json."
            exit 1
          fi
          if ! run_id=$(jq -er '.runId | strings | select(length > 0)' public/data/latest.json); then
            echo "::error::public/data/latest.json har ingen runId, så publiseringen kan ikke leses tilbake. Ingenting publiseres."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Ikke main, så ingenting publiseres eller leses tilbake."
            exit 0
          fi
          {
            echo "branch=true"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.target.outputs.branch == 'true'
        with:
          name: data-branch-file
          path: public/data/latest.json
          retention-days: 1

      # Also after the timeout, which GitHub reports as cancelled and not as failed.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: data-run-log
          path: data-run.log
          retention-days: 7

  # The only job that can write to the repo, and it runs no project code.
  branch:
    needs: data
    if: needs.data.outputs.branch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: data-branch-file
          path: data-branch-file
      # One parentless commit, force pushed, so the branch gets no history that grows.
      - name: Publish latest.json to the branch data
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w data-branch-file/latest.json)
          tree=$(printf '100644 blob %s\tlatest.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: oppdater latest.json fra kjøring $GITHUB_RUN_ID")
          git push --force origin "$commit:refs/heads/data"

  # Proves the publishing on the address itself: a green deploy says nothing about what is out there.
  # A job of its own with no access and no checkout, so a failure here cannot touch what is published.
  # The concurrency group holds for the whole run, so the next hourly run cannot replace the file during
  # the read-back.
  verify:
    needs: [data, branch]
    if: ${{ !cancelled() && needs.data.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    env:
      EXPECTED_RUN_ID: ${{ needs.data.outputs.run_id }}
      # raw.githubusercontent.com answers max-age=300, and the site reads through it, so the limit has to
      # survive a full cache period.
      READBACK_LIMIT_SECONDS: 720
      READBACK_INTERVAL_SECONDS: 20
    steps:
      - name: Read back from the branch data
        if: ${{ !cancelled() && needs.branch.result == 'success' }}
        env:
          URL: https://raw.githubusercontent.com/${{ github.repository }}/data/latest.json
        run: &read-back |
          deadline=$((SECONDS + READBACK_LIMIT_SECONDS))
          response=$(mktemp)
          while true; do
            status=$(curl --silent --location --max-time 30 --output "$response" --write-out 'HTTP %{http_code}' "$URL") || status="ikke noe svar"
            if [ "$status" != "HTTP 200" ]; then
              found="ingen ($status)"
            elif ! found=$(jq -er '.runId' "$response" 2>/dev/null); then
              found="ingen (ikke JSON, eller uten runId)"
            fi
            if [ "$found" = "$EXPECTED_RUN_ID" ]; then
              echo "$URL har runId $found fra denne kjøringen."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$URL har ikke fila fra denne kjøringen innen $READBACK_LIMIT_SECONDS s. Forventet runId $EXPECTED_RUN_ID, fant $found."
              exit 1
            fi
            echo "$URL: forventet runId $EXPECTED_RUN_ID, fant $found. Prøver igjen om $READBACK_INTERVAL_SECONDS s."
            sleep "$READBACK_INTERVAL_SECONDS"
          done

      # The address users open: the rewrite in vercel.json must reach the file with the right content type.
      - name: Read back from the site
        if: ${{ !cancelled() && needs.branch.result == 'success' }}
        env:
          URL: https://snowfinder-seven.vercel.app/data/latest.json
        run: *read-back

      # A publishing job that was skipped or timed out reads nothing back, so without this step the run
      # could be green with nothing out.
      - name: Check that everything was published
        if: ${{ !cancelled() }}
        env:
          DATA_BRANCH: ${{ needs.data.outputs.branch }}
          BRANCH_RESULT: ${{ needs.branch.result }}
        run: |
          failed=0
          if [ "$DATA_BRANCH" != true ]; then
            echo "::error::Jobben data valgte ikke grenen data (branch: «$DATA_BRANCH»), men alle kjøringer på main skal skrive den."
            failed=1
          fi
          if [ "$BRANCH_RESULT" != success ]; then
            echo "::error::Publiseringen til grenen data ble ikke fullført (resultat: $BRANCH_RESULT)."
            failed=1
          fi
          exit "$failed"
